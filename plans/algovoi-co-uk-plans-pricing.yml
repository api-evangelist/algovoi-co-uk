tags: [Payments, Agentic Commerce, x402, Stablecoins, Self-hosted]
description: >-
  Three pricing models, all published. (1) AlgoVoi Pay, the hosted tenant-free rail: a flat 0.01 USDC per paid call with
  no account, no licence and no percentage cut — the authoritative price is the amount in each service's live 402
  challenge (10000 micro-USDC observed on 2026-09-19 for receipt-verify, rfc9421-verify and url-screen; the machine
  index lists compliance-receipt at 50000 micro-USDC, "coming_soon"). (2) The hosted multi-tenant gateway
  (api.algovoi.co.uk): 60 days free on testnet with no KYC, then KYC unlocks a $1,000 lifetime allowance of free mainnet
  volume, then a merchant-absorbed 0.50% per confirmed payment with volume tiers 0.40% ($10k-$100k/month) and 0.30%
  ($100k+, or by negotiation); no monthly, setup, payout, on/off-ramp or chargeback fees. (3) Self-hosted products on
  one-time perpetual licences (some with an annual alternative), priced in USD and paid in USDC at the suite store:
  Payment Rails $5,000, Verifiable Compliance Suite $5,000, Payment Mandate $4,500 / $1,500 per year, Privacy Proofs
  $3,000 / $1,000 per year, Evidence Auditor $599 / $299 per year, Reseal $99 / $39 per year, Keystone components free.
  Enterprise terms (multi-deployment, warranty, indemnity, SLA) are "talk to us".
plan_count: 11
