description: >-
  AlgoVoi publishes a large open Apache-2.0/MIT reference layer under the npm scope @algovoi and matching PyPI names
  (canonicalisation substrate, RFC 9421 signer/verifier family, receipt/webhook verifiers, Agent Trust Bench client, MCP
  server, ElizaOS plugin, n8n node), a Rust crate and a Go module for the RFC 9421 verifier, four zero-dependency
  "native SDKs" (Go, PHP, Python, Rust) shipped as single files in the Platform-Adapters repo rather than on a registry,
  and a browser wallet extension on the Chrome Web Store and Firefox AMO. Everything below is first-party (published from
  github.com/chopmob-cloud, the org the company's llms.txt names). Two third-party packages that carry the name —
  arc56-generated-nautilusoss-algovoi (scholtz) and @schemastore/algovoi-compliance-receipt-v1 — are excluded.
  Currency signal: the most recent registry release is algovoi-atb 0.1.6 / algovoi-reseal-verify 0.2.1 on 2026-08-28; the
  MCP server packages were last released 2026-05-29 (1.7.0) while the hosted clinic MCP reports 1.29.0.
