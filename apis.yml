- aid: algovoi-co-uk:algovoi-mcp-server
  name: AlgoVoi MCP Server
  description: >-
    Model Context Protocol access to AlgoVoi three ways. A hosted anonymous Streamable HTTP endpoint at
    https://agents.algovoi.co.uk/mcp (algovoi-mcp-server 1.29.0, protocol 2025-06-18; tools/list returns three offline RFC
    9421 tools with inputSchema); a hosted x402-gated endpoint at https://mcp.algovoi.co.uk/mcp (ulu-mcp 0.0.1, initialize
    succeeds, tools/list answers 402 with a 1 VOI challenge — tool set unknown); and a local stdio package published to npm
    (@algovoi/mcp-server 1.7.0) and PyPI (algovoi-mcp 1.7.0), listed in the official MCP Registry, exposing 29 tenant-gateway
    tools (payment links, x402/MPP/AP2 challenges and verification, A2A pay-and-call, recurring authorities, MPP
    subscriptions, Bazaar discovery, sanctions screening, compliance attestation) with an algv_ API key.
  humanURL: https://docs.algovoi.co.uk/integrations/mcp-server
