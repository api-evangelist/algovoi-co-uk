- aid: algovoi-co-uk:algovoi-gateway-api
  name: AlgoVoi Gateway API
  description: >-
    The multi-tenant payment gateway (OpenAPI 3.1.0 "AlgoVoi Gateway" 1.0.0-phase1c, 115 operations, 99 schemas) at
    api.algovoi.co.uk: hosted checkout links and the checkout lifecycle (QR, build/submit txn, detect, status, cancel,
    abandon, cross-chain bridge), x402 and MPP gated resources and subscriptions, the AP2 mandate chain
    (intent/cart/pay/confirm/status), an A2A surface (message:send, tasks, pushNotificationConfigs, /a2a/jsonrpc,
    /a2a/gibberlink), customers, subscriptions, Tier 2 recurring authorities and hosted authorisation, payouts, compliance
    screening and a public compliance attestation, receipt and RFC 9421 verification, the suite store, signup proxies and
    the Agentic Payment Mandates portal. Authenticated with a tenant Bearer key (algv_) plus X-Tenant-Id; 300 req/min per
    tenant with X-RateLimit-* headers; Idempotency-Key on creates; Stripe-shaped HMAC-signed webhooks.
  humanURL: https://docs.algovoi.co.uk/api-reference/introduction
  baseURL: https://api.algovoi.co.uk
