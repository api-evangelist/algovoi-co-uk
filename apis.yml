aid: algovoi-co-uk
name: AlgoVoi
description: >-
  AlgoVoi (AlgoVoi Ltd, UK; founder Christopher Hopley) builds compliance-aware, offline-verifiable payment and evidence
  infrastructure for AI agents across twelve mainnet chains, answering all four agent-payment protocols — x402, A2A, MPP and
  AP2 — from one settlement core. It runs two hosted doors: AlgoVoi Pay at pay.algovoi.co.uk, a tenant-free rail that
  charges 0.01 USDC per call with no account or API key (payment is the credential) and returns an Ed25519 receipt anyone
  can verify offline, and the multi-tenant Gateway at api.algovoi.co.uk (Bearer key + X-Tenant-Id, hosted checkout,
  recurring authorities, sanctions screening, hash-chained audit trail, Stripe-shaped signed webhooks). Around them sit an
  anonymous RFC 9421 signing clinic reachable over REST, A2A and a hosted MCP server, the Agent Trust Bench (187
  adversarial x402 research profiles), an audit-bundle verifier, five OpenAPI 3.1 contracts, A2A agent cards on five hosts,
  a published Agent Skill, llms.txt on four hosts, did:web identities, and a large Apache-2.0 reference layer on npm and
  PyPI (RFC 9421 signer/verifier, JCS substrate, receipt formats, an MCP server). Self-hosted products (Payment Rails,
  Verifiable Compliance Suite, post-quantum Reseal and Evidence Auditor) sell on perpetual licences paid in USDC.
image: https://algovoi.co.uk/apple-touch-icon.png
