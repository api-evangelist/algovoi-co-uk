- aid: algovoi-co-uk:algovoi-rfc9421-clinic-api
  name: AlgoVoi RFC 9421 Clinic (Verifiable-Comms Agent) API
  description: >-
    Free, anonymous, verify-only service at agents.algovoi.co.uk (OpenAPI 3.1.0 "AlgoVoi Verifiable-Comms Agent" 0.1.0, 9
    operations): verify an RFC 9421 HTTP message signature with RFC 9530 Content-Digest offline against a supplied Ed25519
    key or did:key, get a diagnosis with the exact canonical signature base, or fetch a known-good signed request from an
    ephemeral demo key. Reachable over plain HTTP, A2A JSON-RPC (/a2a; message/send for 0.3.0 and SendMessage for 1.0.1) and
    an anonymous Streamable HTTP MCP server (/mcp) exposing the same tools. Backed by the shipped algovoi-rfc9421-verifier
    0.4.4 package.
  humanURL: https://agents.algovoi.co.uk/clinic/guide
  baseURL: https://agents.algovoi.co.uk
