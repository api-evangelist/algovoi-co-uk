- aid: algovoi-co-uk:algovoi-agent-trust-bench-api
  name: AlgoVoi Agent Trust Bench API
  description: >-
    Open, provider-neutral x402 research surface (OpenAPI 3.1.0 "AlgoVoi Agent Trust Bench" 0.1.0, 7 operations, servers[]
    https://agent-trust-bench.algovoi.co.uk, MIT): GET /{profile_id} presents one of 187 adversarial or benign payment
    profiles as a 402 challenge (max $1.00 USDC, publicly logged, proceeds donated), /freebie is the always-free control,
    /discovery/resources is a Bazaar-format catalog of every profile, /.well-known/x402.json the discovery manifest and
    /stats.json aggregate statistics. Agents that pass can fetch a Falcon-1024 or Bulletproofs ATB Pass Certificate that
    earns a 20% discount at participating x402 gateways.
  humanURL: https://docs.algovoi.co.uk/agent-trust-bench
