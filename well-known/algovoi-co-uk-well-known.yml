  ai_plugin: /.well-known/ai-plugin.json returns 200 on api. and cloud., but the body is the A2A agent card, not
    an OpenAI plugin manifest; recorded as present-but-not-that-document and not counted.
  path_echo_control: passed on every host (404, or 405 on api.algovoi.co.uk which answers 405 for every unknown
    /.well-known/ path)
