source: Live GET probes of the closed /.well-known/* path list (plus /apis.json and /apis.yml) on every host the
  record knows — the apex and www, the five API baseURL hosts, the OpenAPI servers[] host, the docs host, the two
  MCP server hosts, the cloud edge and the dashboard — on 2026-09-19, with a negative-control path on each. Every
  row is a request that was issued; every status is the one returned.
summary:
  hosts_probed: 11
  documents_served: security.txt on 3 hosts (apex, api, cloud); A2A agent cards on 5 hosts; did.json + jwks.json
    on 2; x402 descriptors on 3; an Agent Skills discovery index and a pay-skills catalog
  oauth_oidc: 'No host serves openid-configuration, oauth-authorization-server or oauth-protected-resource. That
    is consistent with the surfaces: the gateway authenticates with static tenant Bearer keys, the pay rail and
    the clinic are anonymous, and the ulu MCP server gates tools/list with an x402 402 rather than an OAuth challenge
    — there is no authorization server to describe.'
