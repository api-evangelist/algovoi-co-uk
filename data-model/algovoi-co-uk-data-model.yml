identifiers:
- field: tenant_id
  format: UUID (X-Tenant-Id header)
  docs: https://docs.algovoi.co.uk/api-reference/authentication
- field: token (checkout)
  format: opaque URL slug, e.g. uW9MJN-abc123 — "NOT the UUID id field" (A2A check-status skill); appears in checkout_url https://api.algovoi.co.uk/checkout/{token}
- field: cancel_secret
  format: merchant-only secret returned at link creation; never embedded in the public checkout page
- field: tx_id / tx_hash
  format: chain-native transaction id (Algorand 52-char, EVM 0x…, Solana signature, Hedera 0.0.x@…, Stellar hash)
- field: chain / network
  format: CAIP-2 (eip155:8453, algorand:mainnet, solana:<genesis>, stellar:pubnet, hedera:mainnet, voi:mainnet) or the SDK short form algorand_mainnet
    / base_mainnet
- field: asset.id
  format: ASA id, HTS token id, ERC-20 contract, SPL mint, or USDC:{issuer} on Stellar
- field: amount_microunits / amount_minor
  format: string integer in minor units (6 dp USDC, 7 dp Stellar, 18 dp Arc gas USDC)
- field: evt_ id
  format: evt_<uuid> webhook event id — dedupe key
- field: request_id
  format: req_… echoed from X-Request-Id
- field: payment_reference (pay rail)
  format: <unix>:<hex16>:<sha256hex> challenge token, TTL 1800 s
- field: settled_payment_ref
  format: sha256:hex(sha256('algovoi-payable-core:'+tx_id+':<internal_network>'))
- field: api key prefixes
  format: algv_ tenant, algvc_ admin, algvw_ webhook secret
