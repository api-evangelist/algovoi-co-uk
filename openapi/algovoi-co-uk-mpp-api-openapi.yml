paths:
  /mpp/challenge:
    post:
      tags:
      - mpp
      summary: Mpp Challenge
      description: 'Explicit challenge pre-fetch for MPP agents that want to obtain a

        challenge token before building their payment transaction.


        Returns the same challenge object that GET /mpp/{resource_id} returns

        in its 401 body, allowing agents to pipeline challenge fetch → pay →

        proof submission without the round-trip to the resource endpoint.'
      operationId: mpp_challenge_mpp_challenge_post
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tenant Id
      - name: x-tenant-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MppChallengeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MppChallengeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: api_key
  /mpp/probe:
    get:
      tags:
      - mpp
      summary: Mpp Probe
      description: 'Discovery probe + operator-level paid resource.


        No Authorization header → 402 + WWW-Authenticate: Payment challenge.

        Authorization: Payment → verify on-chain → 200 receipt.


        Payment goes to the AlgoVoi operator address (not a tenant). No DB

        session needed — facilitator verifies on-chain; receipt is logged.'
      operationId: mpp_probe_mpp_probe_delete
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              description: Optional payment proof or invocation parameters
              example: {}
        required: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '402':
          description: 'Payment Required — WWW-Authenticate: Payment'
      minPrice: 10000
      maxPrice: 10000
      inputSchema:
        type: object
        additionalProperties: true
      outputSchema:
        type: object
        properties:
          receipt:
            type: string
          resource_id:
            type: string
          tx_id:
            type: string
      x-payment-info:
        authMode: payment
        protocols:
        - x402
        - mpp
        price:
          mode: fixed
          amount: '10000'
          currency: '0x20c000000000000000000000b9537d11c60e8b50'
      x-discovery:
        resources:
        - url: https://api.algovoi.co.uk/mpp/probe
          description: MPP probe — canonical Tempo USDCe payment challenge
          network: tempo
          amount: '10000'
          asset: '0x20c000000000000000000000b9537d11c60e8b50'
