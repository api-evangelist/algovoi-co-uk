  /mpp/{resource_id}:
    get:
      tags:
      - mpp
      summary: Mpp Resource
      description: 'IETF draft-httpauth-payment resource gate.


        No Authorization header → HTTP 401 + WWW-Authenticate: Payment challenge.

        Authorization: Payment → validate challenge echo → verify on-chain → HTTP 200.


        The x402 /protected/{resource_id} endpoint is completely unchanged.'
      operationId: mpp_resource_mpp__resource_id__get
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      - name: tenant_id
        in: query
        required: false
        schema:
