openapi: 3.2.0
info:
  title: AlgoVoi Gateway Atb License API
  description: Public-facing x402 payment gateway.
  version: 1.0.0-phase1c
  x-guidance: To access payment-gated resources, send the required payment proof header. Use GET /mpp/{resource_id} for MPP or GET /protected/{resource_id} for x402.
tags:
- name: atb-license
paths:
  /atb/license/activate:
    post:
      tags:
      - atb-license
      summary: Activate
      description: 'Issue a Falcon-signed activation token for an atb-zkp-service operator.


        The returned token must be verified by the container against the AlgoVoi

        license public key before the service will start. Tokens are bound to the

        operator''s DID and nonce — replay of a stolen token fails nonce validation

        on the container side.'
      operationId: activate_atb_license_activate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: api_key
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ActivateResponse:
      properties:
        token:
          type: string
          title: Token
        expires_at:
          type: string
          title: Expires At
        license_kid:
          type: string
          title: License Kid
      type: object
      required:
      - token
      - expires_at
      - license_kid
      title: ActivateResponse
    ActivateRequest:
      properties:
        operator_did:
          type: string
          title: Operator Did
        nonce:
          type: string
          title: Nonce
      type: object
      required:
      - operator_did
      - nonce
      title: ActivateRequest
x-discovery:
  ownershipProofs:
  - eb10b2d7fb1e2fcbea7a4c5b031e339daacc7cf37d1fb569c58849287c121633
  resources:
  - https://api.algovoi.co.uk/mpp/probe
  resourcesCatalog: https://api.algovoi.co.uk/discovery/resources
