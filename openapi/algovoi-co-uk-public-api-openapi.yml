tags:
- name: Public
paths:
  /subscription/{cancel_secret}/cancel:
    get:
      tags:
      - Public
      summary: Public Cancel Page
      description: 'Public page — single-use cancel link given to customer at signup.

        GET shows a confirmation page; POST commits the cancellation.'
      operationId: public_cancel_page_subscription__cancel_secret__cancel_get
      parameters:
      - name: cancel_secret
        in: path
        required: true
        schema:
          type: string
          title: Cancel Secret
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: none
    post:
      tags:
      - Public
      summary: Public Cancel Commit
      operationId: public_cancel_commit_subscription__cancel_secret__cancel_post
      parameters:
      - name: cancel_secret
        in: path
        required: true
        schema:
          type: string
          title: Cancel Secret
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: none
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
