openapi: 3.2.0
info:
  title: AlgoVoi Gateway Public API
  description: Public-facing x402 payment gateway.
  version: 1.0.0-phase1c
  x-guidance: To access payment-gated resources, send the required payment proof header. Use GET /mpp/{resource_id} for MPP or GET /protected/{resource_id} for x402.
tags:
- name: Public
paths:
  /subscription/{cancel_secret}/cancel:
    get:
      tags:
      - Public
      summary: Public Cancel Page
      description: 'Public page — single-use cancel link given to customer at signup.

        GET shows a confirmation page; POST commits the cancellation.'
      operationId: public_cancel_page_subscription__cancel_secret__cancel_get
      parameters:
      - name: cancel_secret
        in: path
        required: true
        schema:
          type: string
          title: Cancel Secret
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: none
    post:
      tags:
      - Public
      summary: Public Cancel Commit
      operationId: public_cancel_commit_subscription__cancel_secret__cancel_post
      parameters:
      - name: cancel_secret
        in: path
        required: true
        schema:
          type: string
          title: Cancel Secret
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: none
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
x-discovery:
  ownershipProofs:
  - eb10b2d7fb1e2fcbea7a4c5b031e339daacc7cf37d1fb569c58849287c121633
  resources:
  - https://api.algovoi.co.uk/mpp/probe
  resourcesCatalog: https://api.algovoi.co.uk/discovery/resources
