  /message:send:
    post:
      tags:
      - A2a
      summary: Send Message
      description: 'Send a message to the AlgoVoi payment agent (A2A HTTP+JSON binding).


        Returns the completed Task as the bare resource, serialized to the

        negotiated A2A version (0.3 or 1.0). The AlgoVoi payment skills

        (verify-payment, create-checkout, check-status, post-twitter-checkout) are

        invoked via a `skill` marker in a DataPart; a skill-less message is

        acknowledged with a completed task.'
      operationId: send_message_message_send_post
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tenant Id
      - name: x-tenant-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_SendMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-payment-info:
        authMode: api_key
  /message:stream:
    post:
      tags:
      - A2a
      summary: Message Stream
      description: 'Streaming is not supported (capabilities.streaming=false) — return a

        typed UnsupportedOperation error (400) rather than a bare 404/405.'
