source: >-
  Derived by binding the MCP tools in mcp/algovoi-co-uk-mcp.yml (the three live tools returned by tools/list on
  agents.algovoi.co.uk/mcp, and the 27 stdio-package tool names published on docs.algovoi.co.uk/integrations/mcp-server)
  to the operationIds in openapi/algovoi-co-uk-gateway-openapi.yml (115 operations), openapi/algovoi-co-uk-clinic-openapi.yml
  (9) and openapi/algovoi-co-uk-pay-openapi.yml (17). The A2A skills on the three graded cards are bound in a2a_skills[].
  Confidence is high where the provider's own tool description names the endpoint, medium where the semantics match one
  operation, low where the tool composes a header locally and the REST operation is a server-side equivalent.
purpose: >-
  Make the MCP tool the first-class discovery unit and bind it to its backing REST operation. AlgoVoi's REST, A2A and MCP
  surfaces are overlapping-but-divergent projections of one payment core: the hosted clinic MCP is verify-only, the stdio
  MCP wraps the tenant gateway, the pay rail is REST/A2A only, and the ulu MCP's tool set is behind an x402 paywall.
surfaces:
  rest_openapi:
    gateway: openapi/algovoi-co-uk-gateway-openapi.yml        # https://api.algovoi.co.uk/openapi.json — tenant Bearer + X-Tenant-Id
    pay: openapi/algovoi-co-uk-pay-openapi.yml                # https://pay.algovoi.co.uk/openapi.json — payment is the auth
    clinic: openapi/algovoi-co-uk-clinic-openapi.yml          # https://agents.algovoi.co.uk/openapi.json — anonymous
    agent_trust_bench: openapi/algovoi-co-uk-agent-trust-bench-openapi.yml
    audit_verifier: openapi/algovoi-co-uk-audit-verifier-openapi.yml
  mcp:
    clinic_remote: https://agents.algovoi.co.uk/mcp           # anonymous; tools/list open (3 tools)
    ulu_remote: https://mcp.algovoi.co.uk/mcp                 # tools/list gated by an x402 402 — tools unknown, not crosswalked
    stdio: npx -y @algovoi/mcp-server                         # 29 tools per docs; schemas not introspected here
  a2a:
    pay: https://pay.algovoi.co.uk/a2a                        # live JSON-RPC; 5 skills
    clinic: https://agents.algovoi.co.uk/a2a                  # live JSON-RPC; 3 skills
    gateway: https://api.algovoi.co.uk/a2a/jsonrpc            # 401 anonymously; 5 skills
