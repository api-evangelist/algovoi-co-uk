# --- hosted clinic MCP (live tools/list) ---
- tool: verify_rfc9421
  server: clinic-remote
  category: verification
  rest: [verify_verify_rfc9421_post]
  also: [verify_rfc9421_verify_rfc9421_post, pay_verify_rfc9421_pay_v1_verify_rfc9421_post]
  binding: rest
  confidence: high
  note: The tool runs the same shipped verifier (algovoi-rfc9421-verifier 0.4.4) offline; POST /verify/rfc9421 on the clinic host is the REST twin, the gateway exposes the same verifier under tenant auth, and the pay rail sells it at $0.01 with a signed receipt.
- tool: explain_rfc9421
  server: clinic-remote
  category: diagnostics
  rest: [explain_verify_rfc9421_explain_post]
  binding: rest
  confidence: high
  note: Same output fields (valid, errors, signature_base, content_digest, covered_components, diagnosis) as POST /verify/rfc9421/explain.
