summary: >-
  AlgoVoi serves FIVE A2A agent cards from hosts under its own registrable domain, and this manifest grades the
  provider on the strongest of them — the AlgoVoi Payable Rail card on pay.algovoi.co.uk — because it is a
  conformant 0.3.0 card whose declared endpoint is a live A2A JSON-RPC responder. It sits at the canonical
  /.well-known/agent-card.json (protocolVersion 0.3.0, preferredTransport JSONRPC at https://pay.algovoi.co.uk/a2a,
  five skills, a did:web identity, the google-agentic-commerce a2a-x402 extension declared as required, and a
  securitySchemes entry whose scheme is "x402" — payment is the authentication). The Verifiable-Comms Agent card on
  agents.algovoi.co.uk also grades conformant (0.3.0 plus a 1.0.1 interface declared in supportedInterfaces). The
  AlgoVoi Payment Agent card served by api.algovoi.co.uk (and mirrored byte-identically at the legacy
  /.well-known/agent.json on the apex, at the legacy path on api., and — unusually — at /.well-known/ai-plugin.json
  on api.) carries no protocolVersion and grades flavored; the cloud.algovoi.co.uk variant of that card grades flavored
  for the same reason. docs.algovoi.co.uk serves a Mintlify-generated "AlgoVoi Platform" card that is shape-conformant
  but platform-authored. Every card was fetched with HTTP 200 and application/json, every host passed a
  negative-control probe (a /.well-known/ path that cannot exist returned 404, or 405 on api. which returns 405 for
  every unknown /.well-known/ path), and ownership is settled by the documents themselves: every provider block
  names organization "AlgoVoi" with a url on algovoi.co.uk or pay.algovoi.co.uk, the pay card's did:web resolves at
  https://pay.algovoi.co.uk/.well-known/did.json to a DID document whose service block points back at this card, and
  the a2aregistry.org entry that brought AlgoVoi into the harvest lists this exact wellKnownURI.
